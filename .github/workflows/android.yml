name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3
        with:
          # Install exactly the NDK + CMake the native build needs. Specifying
          # our own package list also avoids the action's default (and now
          # broken) legacy "tools" package install. AGP auto-downloads the
          # platform and build-tools during the build.
          packages: "ndk;26.3.11579264 cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nodeai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
